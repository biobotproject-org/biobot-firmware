name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detector-tests:
    name: Detector host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        working-directory: Firmware/Notecard
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I. anomaly.cpp test/test_anomaly.cpp -o test_anomaly
          ./test_anomaly

  compile-sketch:
    name: Compile for Arduino Nano ESP32
    runs-on: ubuntu-latest
    # The SparkFun BMV080 library links against Bosch's proprietary BMV080 SDK,
    # which cannot be redistributed. This job needs it from a private repository
    # you control (see README, "Bosch BMV080 SDK"). Without the two secrets the
    # job explains itself and passes, so the badge stays honest but green.
    env:
      HAVE_SDK: ${{ secrets.BMV080_SDK_REPO != '' && secrets.BMV080_SDK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the Bosch SDK is not available
        if: env.HAVE_SDK != 'true'
        run: echo "::notice title=ESP32 compile skipped::The Bosch BMV080 SDK is not available to CI. Add the BMV080_SDK_REPO and BMV080_SDK_TOKEN repository secrets (README, 'Bosch BMV080 SDK') to enable the real compile."
      - name: Install arduino-cli
        if: env.HAVE_SDK == 'true'
        uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        if: env.HAVE_SDK == 'true'
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:esp32
          arduino-cli lib install "Adafruit BME680 Library" "Adafruit Unified Sensor" "SparkFun BMV080 Arduino Library" "Blues Wireless Notecard"
      - name: Install the Bosch BMV080 SDK into the SparkFun library
        if: env.HAVE_SDK == 'true'
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BMV080_SDK_TOKEN }}@github.com/${{ secrets.BMV080_SDK_REPO }}" bmv080-sdk
          LIB="$HOME/Arduino/libraries/SparkFun_BMV080_Arduino_Library/src"
          cp bmv080-sdk/api/inc/bmv080.h bmv080-sdk/api/inc/bmv080_defs.h "$LIB/sfTk/"
          cp bmv080-sdk/api/api/lib/xtensa_esp32s3/xtensa_esp32s3_elf_gcc/release/lib_bmv080.a \
             bmv080-sdk/api/api/lib/xtensa_esp32s3/xtensa_esp32s3_elf_gcc/release/lib_postProcessor.a "$LIB/esp32s3/"
      - name: Provide a config.h for the build
        if: env.HAVE_SDK == 'true'
        run: cp Firmware/Notecard/config.example.h Firmware/Notecard/config.h
      - name: Compile
        if: env.HAVE_SDK == 'true'
        run: arduino-cli compile --fqbn arduino:esp32:nano_nora --warnings default Firmware/Notecard
